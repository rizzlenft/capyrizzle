<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#2a1b6b" />
<meta name="game:owner" content="rizzle" />
<meta name="game:title" content="CapyRizzle Rush" />
<meta name="game:event" content="capyjam-2026" />
<title>CapyRizzle Rush</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="540" aria-label="CapyRizzle Rush game"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-row">
        <div class="hud-pill" id="score">0</div>
        <div class="hud-pill combo-pill" id="combo">×1</div>
        <div class="hud-pill" id="best">BEST 0</div>
      </div>
      <div class="boost-wrap">
        <div class="boost-label" id="boostLabel">SIREN</div>
        <div class="boost-bar"><div class="boost-fill" id="boost"></div></div>
      </div>
      <!-- Appears under the score pill when the run is closing in on /
           past the personal best. Pure motivation. -->
      <div class="best-chase hidden" id="bestChase"></div>
    </div>

    <div id="comboPop" class="combo-pop hidden"></div>
    <div id="milestonePop" class="milestone-pop hidden"></div>

    <!-- DEBUG: build tag + live state. Tells us at a glance which build is
         loaded and what the death sequence is doing. Remove after diagnosis. -->
    <div id="debugTag">build —</div>
    <div id="debugState">mode: —</div>

    <div id="title" class="overlay">
      <h1 class="logo"><span class="line1">CAPYRIZZLE</span><span class="line2">RUSH</span></h1>
      <p class="tag">Tap / Space to JUMP fires.<br/>Grab WATER for siren boost — smash everything.</p>
      <button class="bigbtn" id="start">PLAY</button>
      <p class="title-best hidden" id="titleBest"></p>
      <p class="credit">a capyjam 2026 entry</p>
    </div>

    <div id="gameover" class="overlay hidden">
      <h2 class="gg">WIPEOUT</h2>
      <div class="rank-row">
        <div class="rank-label">RANK</div>
        <div class="rank-letter" id="finalRank">D</div>
      </div>
      <div class="stats">
        <div class="stat"><div class="stat-label">SCORE</div><div class="stat-value" id="finalScore">0</div></div>
        <div class="stat"><div class="stat-label">BEST COMBO</div><div class="stat-value" id="finalCombo">×1</div></div>
        <div class="stat"><div class="stat-label">FIRES SMASHED</div><div class="stat-value" id="finalSmashed">0</div></div>
        <div class="stat"><div class="stat-label">BEST</div><div class="stat-value" id="finalBest">0</div></div>
      </div>
      <div class="stats-mini">
        <span class="mini-stat"><span class="mini-label">DIST</span> <span id="finalDist">0m</span></span>
        <span class="mini-sep">·</span>
        <span class="mini-stat"><span class="mini-label">TIME</span> <span id="finalTime">0:00</span></span>
        <span class="mini-sep">·</span>
        <span class="mini-stat"><span class="mini-label">NEAR</span> <span id="finalNear">0</span></span>
        <span class="mini-sep">·</span>
        <span class="mini-stat"><span class="mini-label">SIRENS</span> <span id="finalBoosts">0</span></span>
        <span class="mini-sep mini-shield-sep hidden">·</span>
        <span class="mini-stat mini-shield hidden"><span class="mini-label">SHIELDS</span> <span id="finalShields">0</span></span>
      </div>
      <p class="newbest hidden" id="newBest">NEW BEST!</p>
      <button class="bigbtn" id="retry">GO AGAIN</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
